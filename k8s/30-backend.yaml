# Django backend. Image tag copied from the live Compose file (pinned, not :latest).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: daykin
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
# Media storage, shared by backend and Celery worker (as in Compose: daykin_media).
# ReadWriteOnce works here because everything runs on one node; use RWX or object
# storage before moving to multiple nodes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daykin-media
  namespace: daykin
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi   # live media archive is ~158 MB compressed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: daykin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Kubernetes has no depends_on. Wait until MySQL accepts connections first.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: backend
          image: kennedymutebi/daykin-backend:18026a3fd3278771ffe3f5484c3984110b0cfa05
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: daykin-config
            - secretRef:
                name: daykin-secrets
          # TODO: add readiness/liveness probes once a reliable health endpoint is identified.
          # TODO: check what /app/entrypoint.sh does (migrations? collectstatic?) before scaling.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: static           # collectstatic writes here at every start
              mountPath: /app/staticfiles
        # Sidecar: Nginx serves /static/ and /media/ and forwards /api/ to Django.
        # It shares the pod's network (Django = 127.0.0.1:8000) and the two folders.
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: static
              mountPath: /app/staticfiles
              readOnly: true
            - name: media
              mountPath: /app/media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: daykin-media
        - name: static
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: web-nginx-conf
---
# Public entry point (the Nginx sidecar). Later, Nginx Proxy Manager points here.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: daykin
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 80