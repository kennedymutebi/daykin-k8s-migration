# Non-secret configuration. Confirm variable names against the backend settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: daykin-config
  namespace: daykin
data:
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "<your-domain>"
  CORS_ALLOWED_ORIGINS: "https://<your-domain>"
  CSRF_TRUSTED_ORIGINS: "https://<your-domain>"
  MYSQL_DATABASE: "<database-name>"
  MYSQL_USER: "<app-user>"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
