# Non-secret settings, mirrored from the live .env with Kubernetes service names.
# Compose host "daykin_db"    -> Kubernetes Service "mysql"
# Compose host "daykin_redis" -> Kubernetes Service "redis"
# DEBUG is False here on purpose (the live .env currently has DEBUG=True; see lessons-learned.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: daykin-config
  namespace: daykin
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "ebiseera.com,www.ebiseera.com,localhost,127.0.0.1,backend"
  RUNNING_IN_DOCKER: "true"
  DB_NAME: "daykin_db"
  DB_USER: "root"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CORS_ALLOWED_ORIGINS: "https://ebiseera.com,https://www.ebiseera.com,http://localhost:5173,http://127.0.0.1:4200"
  CSRF_TRUSTED_ORIGINS: "https://ebiseera.com"
  MEDIA_URL: "https://ebiseera.com/media/"
