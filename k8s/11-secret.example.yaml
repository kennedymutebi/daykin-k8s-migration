# EXAMPLE ONLY. Do NOT put real values here or commit a real secret.
# Create the real Secret out-of-band, e.g.:
#   kubectl create secret generic daykin-secrets -n daykin \
#     --from-literal=DJANGO_SECRET_KEY='<value>' \
#     --from-literal=MYSQL_PASSWORD='<value>' \
#     --from-literal=MYSQL_ROOT_PASSWORD='<value>'
apiVersion: v1
kind: Secret
metadata:
  name: daykin-secrets
  namespace: daykin
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "<replace-me>"
  MYSQL_PASSWORD: "<replace-me>"
  MYSQL_ROOT_PASSWORD: "<replace-me>"
