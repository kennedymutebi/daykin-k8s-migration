# EXAMPLE ONLY. Do NOT put real values here or commit a real secret.
# Create the real Secret out-of-band with generated random values (see docs/runbook.md):
#   kubectl create secret generic daykin-secrets -n daykin \
#     --from-literal=SECRET_KEY='<random>' \
#     --from-literal=DB_PASSWORD='<random>' \
#     --from-literal=MYSQL_ROOT_PASSWORD='<same value as DB_PASSWORD>'
# DB_PASSWORD is what Django uses; MYSQL_ROOT_PASSWORD is what MySQL is created with.
apiVersion: v1
kind: Secret
metadata:
  name: daykin-secrets
  namespace: daykin
type: Opaque
stringData:
  SECRET_KEY: "<replace-me>"
  DB_PASSWORD: "<replace-me>"
  MYSQL_ROOT_PASSWORD: "<replace-me>"
