# Celery worker and Beat use the same backend image.
# TODO: replace the placeholder module "<django_project>" with the real Celery app module
# (check the backend Compose file's worker/beat commands).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: daykin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: worker
          image: kennedymutebi/daykin-backend:<PINNED_TAG>
          command: ["celery", "-A", "<django_project>", "worker", "-l", "info"]
          envFrom:
            - configMapRef:
                name: daykin-config
            - secretRef:
                name: daykin-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
# Celery Beat: exactly ONE replica, otherwise scheduled jobs run more than once.
# strategy Recreate prevents two Beat pods overlapping during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: daykin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: beat
          image: kennedymutebi/daykin-backend:<PINNED_TAG>
          command: ["celery", "-A", "<django_project>", "beat", "-l", "info"]
          envFrom:
            - configMapRef:
                name: daykin-config
            - secretRef:
                name: daykin-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
