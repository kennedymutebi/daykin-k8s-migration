# Celery worker and Beat use the same backend image as the API.
# Commands copied from the live Compose file: celery -A daykin_backend worker|beat -l info
# The image has its own ENTRYPOINT, so "command" overrides it exactly like Compose "entrypoint".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: daykin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: worker
          image: kennedymutebi/daykin-backend:18026a3fd3278771ffe3f5484c3984110b0cfa05
          command: ["/bin/sh", "-c"]
          args: ["celery -A daykin_backend worker -l info"]
          envFrom:
            - configMapRef:
                name: daykin-config
            - secretRef:
                name: daykin-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: media
              mountPath: /app/media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: daykin-media
---
# Celery Beat: exactly ONE replica, otherwise scheduled jobs run more than once.
# strategy Recreate prevents two Beat pods overlapping during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: daykin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: beat
          image: kennedymutebi/daykin-backend:18026a3fd3278771ffe3f5484c3984110b0cfa05
          command: ["/bin/sh", "-c"]
          args: ["celery -A daykin_backend beat -l info"]
          envFrom:
            - configMapRef:
                name: daykin-config
            - secretRef:
                name: daykin-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi