# Nginx config for the "web" sidecar, copied from the live nginx.conf with two changes:
#   - proxy_pass daykin_backend:8000 -> 127.0.0.1:8000 (Django is in the SAME pod)
#   - server_name ebiseera.com -> _ (accept any Host; Django's ALLOWED_HOSTS still checks it)
# No secrets in this file. See docs/decisions/0004-nginx-sidecar.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx-conf
  namespace: daykin
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        client_max_body_size 100M;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /media/ {
            alias /app/media/;
        }
        location /static/ {
            alias /app/staticfiles/;
        }
    }